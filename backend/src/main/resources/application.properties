# ---- Database (override with environment variables or secrets.properties) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_tracker}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8080

# ---- JWT (set JWT_SECRET in any non-local environment) ----
jwt.secret=${JWT_SECRET:U3VwZXJTZWNyZXRLZXlTdHJpbmctMzJCeXRlcwAAAAAAAAAA}
jwt.expiration=86400000

# ---- Local secrets (gitignored): MAIL_*, VAPID_* and any override above. See secrets.properties.example ----
spring.config.import=optional:classpath:secrets.properties

# ---- Email reminders (Gmail SMTP: use an App Password, not your account password) ----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- Web push reminders (generate keys with: npx web-push generate-vapid-keys) ----
push.vapid.public=${VAPID_PUBLIC_KEY:}
push.vapid.private=${VAPID_PRIVATE_KEY:}
push.vapid.subject=${VAPID_SUBJECT:mailto:admin@example.com}

# ---- Public URL of the frontend, used for links inside emails ----
app.url=${APP_URL:http://localhost:5173}
